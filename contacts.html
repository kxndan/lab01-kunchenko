  <main class="container">
    <h1>Зворотний зв'язок</h1>

    <form action="https://httpbin.org/post" method="post">
      
      <!-- Явні підписи (for + id) -->
      <label for="name">Ім'я</label><br>
      <input type="text" id="name" name="name" required><br><br>

      <label for="email">Електронна пошта</label><br>
      <input type="email" id="email" name="email" required><br><br>

      <label for="subject">Тема звернення</label><br>
      <select id="subject" name="subject">
        <option value="question">Запитання</option>
        <option value="suggestion">Пропозиція</option>
        <option value="error">Повідомлення про помилку на сайті</option>
      </select><br><br>

      <label for="message">Текст повідомлення</label><br>
      <textarea id="message" name="message" rows="5" minlength="10" required></textarea><br><br>

      <!-- Вкладений підпис (label огортає input) -->
      <label>
        <input type="checkbox" name="consent" required>
        Погоджуюсь на обробку персональних даних
      </label><br><br>

      <button type="submit" class="btn">Надіслати</button>
    </form>
  </main>
